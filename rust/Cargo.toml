[package]
name = "pxder"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Pixiv downloader with a terminal UI and scriptable CLI"
license = "GPL-3.0-only"
repository = "https://github.com/zz1998022/pxder-zig"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
md-5 = "0.10"
rand = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "stream", "socks", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "time", "signal"] }
tokio-util = "0.7"
url = "2"
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
